plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.parrot"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.parrot"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.karumi:dexter:6.2.3'
    // need to sync this dependence
    implementation 'androidx.media:media:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //navigation dependence
    //implementation 'com.androidx.support:design:27.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    //Material design
    //implementation 'com.google.android.material:material:1.2.0-alpha02'

//    navigation component
    /*implementation 'androidx.navigation:navigation-fragment-ktx:2.2.0-rc03'
    implementation 'androidx.navigation:navigation-ui-ktx:2.2.0-rc03'*/
    implementation 'androidx.navigation:navigation-fragment:2.8.0'
    implementation 'androidx.navigation:navigation-ui:2.8.0'

   // implementation 'com.android.support:design:23.4.0'
    implementation 'com.github.bullheadandplato:AndroidEqualizer:2.2'
    //to click build after successful syc

    //circle imageview
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}